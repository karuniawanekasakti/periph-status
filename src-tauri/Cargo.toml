[package]
name = "periph-status"
version = "0.1.0"
description = "Battery monitor for wireless peripherals"
license = "MIT"
repository = "https://github.com/karuniawanekasakti/periph-status"
edition = "2021"
default-run = "periph-status"

[lib]
name = "periph_status_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_WinRT",
  # HID access for 2.4 GHz receivers (provider/rongyuan.rs and the HID debug examples)
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
# WinRT collection types (IIterable, IMapView) live in a separate crate since windows 0.59.
windows-collections = "0.2"
# Fixing up the autostart `Run` value (same crate auto-launch uses).
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
